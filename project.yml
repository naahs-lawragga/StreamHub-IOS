name: StreamHub
options:
  bundleIdPrefix: com.streamhub
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
packages:
  StreamHubCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    STREAMHUB_SOURCE_URL: "https://naahs-lawragga.github.io/StreamHub-IOS/source.json"
    STREAMHUB_REPOSITORY_URL: "https:/$()/github.com/naahs-lawragga/StreamHub-iOS"
targets:
  StreamHub:
    type: application
    platform: iOS
    sources:
      - path: StreamHub
    dependencies:
      - package: StreamHubCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamhub.ios
        PRODUCT_NAME: StreamHub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
  StreamHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StreamHubTests
    dependencies:
      - target: StreamHub
      - package: StreamHubCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamhub.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StreamHub:
    build:
      targets:
        StreamHub: all
        StreamHubTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - StreamHubTests
