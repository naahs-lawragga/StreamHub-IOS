name: Approved stable release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Previously approved stable tag to release or repair (for example v0.1.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  release:
    environment: release
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate approved stable tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os,re
          tag=os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag), 'Stable semver tag required'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('STREAMHUB_VERSION='+tag[1:]+'\n')
              owner,repo=os.environ['GITHUB_REPOSITORY'].split('/')
              f.write(f'STREAMHUB_SOURCE_URL=https://{owner}.github.io/{repo}/source.json\n')
              f.write(f'STREAMHUB_PAGES_URL=https://{owner}.github.io/{repo}\n')
          PY
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - name: Select Xcode
        run: bash scripts/select-xcode.sh
      - name: Restore complete XcodeGen installation
        id: xcodegen-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/XcodeGen
          key: xcodegen-${{ runner.os }}-${{ runner.arch }}-Xcode26.3-2.42.0-source-layout-v2
      - name: Install XcodeGen 2.42.0
        if: steps.xcodegen-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 2.42.0 https://github.com/yonaskolb/XcodeGen.git "$RUNNER_TEMP/XcodeGen"
          cd "$RUNNER_TEMP/XcodeGen"
          swift build -c release --product xcodegen
          # Retain the source checkout beside .build: XcodeGen loads its
          # SettingPresets from the checkout, not an SPM .bundle alone.
      - name: Save XcodeGen before app build
        if: steps.xcodegen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/XcodeGen
          key: ${{ steps.xcodegen-cache.outputs.cache-primary-key }}
      - name: Verify XcodeGen presets and add to PATH
        run: |
          test -x "$RUNNER_TEMP/XcodeGen/.build/release/xcodegen"
          test -r "$RUNNER_TEMP/XcodeGen/SettingPresets/base.yml"
          test -r "$RUNNER_TEMP/XcodeGen/SettingPresets/Platforms/iOS.yml"
          test -r "$RUNNER_TEMP/XcodeGen/SettingPresets/Products/bundle.unit-test.yml"
          test -r "$RUNNER_TEMP/XcodeGen/Sources/XcodeGenKit/SettingPresets/base.yml"
          "$RUNNER_TEMP/XcodeGen/.build/release/xcodegen" --version
          echo "$RUNNER_TEMP/XcodeGen/.build/release" >> "$GITHUB_PATH"
      - name: Validate release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and test release IPA
        run: bash scripts/build-ios.sh
      - name: Preserve tested IPA independently of publication
        uses: actions/upload-artifact@v4
        with:
          name: StreamHub-release-${{ inputs.tag || github.ref_name }}-${{ github.run_attempt }}
          path: |
            build/StreamHub-unsigned.ipa
            build/StreamHub-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Prepare version-specific release notes
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path('CHANGELOG.md').read_text()
          version=os.environ['STREAMHUB_VERSION']
          match=re.search(r'^## '+re.escape(version)+r'(?:[ \t][^\n]*)?\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          assert match and match.group(1).strip(), 'Add a changelog section for this release version'
          Path('build/release-notes.md').write_text(match.group(1).strip()+'\n\nThe IPA is unsigned. Install with a compatible signing tool or import into LiveContainer. Device compatibility remains subject to testing.\n')
          PY
      - name: Publish tested release assets without replacing published binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,assets > build/existing-release.json; then
            is_draft=$(python3 -c 'import json; print(str(json.load(open("build/existing-release.json"))["isDraft"]).lower())')
            if [ "$is_draft" = true ]; then
              gh release upload "$RELEASE_TAG" build/StreamHub-unsigned.ipa build/StreamHub-unsigned.ipa.sha256 --clobber
              gh release edit "$RELEASE_TAG" --notes-file build/release-notes.md --draft=false --latest
            else
              python3 - <<'PY'
          import json
          release=json.load(open('build/existing-release.json'))
          names={a['name'] for a in release['assets']}
          assert {'StreamHub-unsigned.ipa','StreamHub-unsigned.ipa.sha256'} <= names, 'Published release has missing assets; issue a new version instead of replacing it'
          print('Published assets preserved. Regenerating source from their verified public downloads.')
          PY
            fi
          else
            gh release create "$RELEASE_TAG" build/StreamHub-unsigned.ipa build/StreamHub-unsigned.ipa.sha256 --verify-tag --draft --notes-file build/release-notes.md --title "StreamHub $STREAMHUB_VERSION"
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
      - name: Generate source from verified public release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/pages/screenshots
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > build/releases.json
          python3 scripts/generate-source.py --releases build/releases.json --repository "$GITHUB_REPOSITORY" --pages-url "$STREAMHUB_PAGES_URL" --output build/pages/source.json
          cp docs/branding/icon-1024.png build/pages/icon.png
          cp build/screenshots/setup.png build/pages/screenshots/setup.png
          cp docs/branding/social-preview.png build/pages/social-preview.png
      - name: Preserve verified source bundle independently of deployment
        uses: actions/upload-artifact@v4
        with:
          name: StreamHub-public-source-${{ github.run_attempt }}
          path: build/pages
          if-no-files-found: error
          retention-days: 90
      - name: Upload release test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-evidence-${{ github.run_attempt }}
          path: |
            build/Tests.xcresult
            build/screenshots
          if-no-files-found: ignore
